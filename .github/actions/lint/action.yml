name: "Lint code"
description: "Runs ktlint and detekt."

runs:
  using: "composite"
  steps:
    - name: "Set up JDK 17"
      uses: ./.github/actions/java
    - name: "Run Detekt"
      shell: sh
      run: sh gradlew detekt
    - name: "Run KtLint"
      shell: sh
      run: sh gradlew ktlintCheck
