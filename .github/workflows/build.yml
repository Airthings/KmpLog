name: "Lint and build code"

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: "Clone code"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: "Lint code"
        uses: ./.github/actions/lint

  build:
    needs: lint
    runs-on: macos-latest
    steps:
      - name: "Clone code"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: "Set up JDK 17"
        uses: ./.github/actions/java
      - name: "Validate Gradle wrapper"
        uses: gradle/actions/wrapper-validation@v6
      - name: "Build code"
        shell: sh
        run: sh gradlew build

      # Nothing else exercises the packaging path: `build` skips the XCFramework, and the archive
      # is only produced by the manual publish workflow — so a malformed one would first be noticed
      # as a broken release. Extract it the way Swift Package Manager does and check the layout.
      - name: "Check the published archive's framework layout"
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleKmpLogReleaseXCFramework zipXCFramework \
            -PENABLE_PUBLISHING=true -PGITHUB_PUBLISH_TOKEN=unused -PGITHUB_REPO="${{ github.repository }}"

          archive=build/kmmbridge/zip/frameworkarchive.zip
          test -s "$archive"

          out=$(mktemp -d)
          trap 'rm -rf "$out"' EXIT
          ditto -x -k "$archive" "$out"
          framework="$out/KmpLog.xcframework/macos-arm64_x86_64/KmpLog.framework"

          # A versioned macOS framework keeps its payload in Versions/A and links everything else
          # to it. Copies instead of links mean readlink fails for consumers, and codesign can
          # reject the bundle outright. -L alone would also accept a dangling link, so resolve
          # each one with -e as well.
          for link in Versions/Current KmpLog Headers Modules Resources; do
            test -L "$framework/$link" || { echo "$link is not a symlink" >&2; exit 1; }
            test -e "$framework/$link" || { echo "$link does not resolve" >&2; exit 1; }
          done

          copies=$(find "$framework" -type f -name KmpLog | wc -l | tr -d ' ')
          test "$copies" -eq 1 || { echo "expected 1 binary in the framework, found $copies" >&2; exit 1; }
