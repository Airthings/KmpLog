name: "Lint and build code, and publish artifacts to repository"

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build_and_publish:
    runs-on: macos-latest
    steps:
      - name: "Clone code"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # The release version, which names the GitHub release and the tag.
      - name: "Read LIBRARY_VERSION"
        id: versionPropertyValue
        shell: bash
        run: |
          # tail -n 1 mirrors .properties last-definition-wins. Without it a duplicated
          # key would concatenate into one string and silently name the tag after it.
          propVal="$(sed -n 's/^LIBRARY_VERSION=//p' gradle.properties | tail -n 1 | tr -d '[:space:]')"
          if ! printf '%s' "$propVal" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "LIBRARY_VERSION is missing or not a version number: '$propVal'" >&2
            exit 1
          fi
          printf 'propVal=%s\n' "$propVal" >> "$GITHUB_OUTPUT"

      # Fails before the release is created. Once it exists, a failure further down leaves the
      # release, the tag and possibly the Maven artifacts behind, and those can't all be cleanly
      # withdrawn — republishing the same version is not a supported recovery.
      - name: "Refuse to republish an existing version"
        shell: bash
        env:
          VERSION: ${{ steps.versionPropertyValue.outputs.propVal }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists." >&2
            echo "Bump LIBRARY_VERSION in gradle.properties and run this again — a version that has" >&2
            echo "been published once cannot be republished, because its Maven artifacts are already" >&2
            echo "in GitHub Packages and moving the tag breaks anyone who resolved it." >&2
            exit 1
          fi

      - name: "Print versionPropertyValue"
        id: output
        run: echo "${{ steps.versionPropertyValue.outputs.propVal }}"

      - name: "Set up JDK 17"
        uses: ./.github/actions/java

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v6

      - name: "Create or Find Artifact Release"
        id: devrelease
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: "${{ steps.versionPropertyValue.outputs.propVal }}"

      - name: "Publish"
        shell: sh
        run: |
          sh gradlew kmmBridgePublish publishAllPublicationsToGitHubPackagesRepository \
            -PGITHUB_ARTIFACT_RELEASE_ID=${{ steps.devrelease.outputs.id }} \
            -PENABLE_PUBLISHING=true \
            -PGITHUB_PUBLISH_TOKEN=${{ secrets.GITHUB_TOKEN }} \
            -PGITHUB_REPO=${{ github.repository }} \
            --no-daemon \
            --info \
            --stacktrace

      # The release hosts the binary, but its URL and checksum are only known after the upload, so
      # Package.swift can only be generated now. It is committed on a throwaway local branch that is
      # never pushed — only the tag moves — which is why the manifest lives on tags and not on main.
      - name: Commit the manifest and move the release tag
        shell: bash
        env:
          VERSION: ${{ steps.versionPropertyValue.outputs.propVal }}
        run: |
          set -euo pipefail
          # -s, not -f: a zero-byte manifest from a partial failure would pass an existence check.
          test -s Package.swift || { echo "Package.swift was not generated, or is empty" >&2; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "build-${VERSION}"
          # Only the manifest. A blanket `git add .` would sweep up anything else the build left
          # behind, and would skip this file entirely if it were ever ignored.
          git add -f Package.swift
          # An unchanged manifest leaves nothing staged, and `git commit` exits non-zero on that —
          # which would abort the job here, after the release already exists, and leave the tag
          # pointing at a commit without the manifest.
          if git diff --cached --quiet; then
            echo "Package.swift is unchanged; nothing to commit, moving the tag to HEAD" >&2
          else
            git commit -m "KMP SPM package release for ${VERSION}"
          fi
          git tag -fa "${VERSION}" -m "KMP release version ${VERSION}"
          git push origin -f "refs/tags/${VERSION}"
